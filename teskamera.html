<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web 360 Panorama Capture</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #1e1e1e; 
            color: white; 
            margin: 0; 
            padding: 15px; 
        }
        video { 
            width: 100%; 
            max-width: 400px; 
            border-radius: 8px; 
            background: #000; 
            transform: scaleX(-1); /* Efek mirror default, akan disesuaikan jika kamera belakang */
        }
        .canvas-container {
            width: 100%;
            overflow-x: auto; /* Agar hasil panorama bisa di-scroll menyamping */
            margin-top: 15px;
            border: 2px solid #444;
            border-radius: 8px;
        }
        canvas { 
            height: 200px; /* Tinggi panorama */
            background: #111; 
            display: block;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 5px; 
            margin: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:disabled { background: #555; color: #888; }
        .btn-rekam { background: #28a745; }
        .btn-rekam.aktif { background: #dc3545; }
        .info { font-size: 13px; color: #bbb; margin-bottom: 15px; line-height: 1.4; }
        #statusInfo { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Kamera Panorama Web</h2>
    <div class="info">
        Berjalan di HTTPS. Aplikasi ini akan membaca rotasi HP Anda dan menempelkan irisan gambar ke kanvas untuk membentuk panorama.
    </div>
    
    <button id="btnMulai">1. Izinkan Kamera & Sensor</button>
    <button id="btnRekam" class="btn-rekam" disabled>2. Mulai Rekam (Putar HP)</button>
    
    <p id="statusInfo">Status: Menunggu izin...</p>
    
    <!-- Viewfinder Kamera -->
    <video id="videoFeed" autoplay playsinline></video>
    
    <!-- Area Hasil Stitching -->
    <div class="info" style="margin-top: 15px;">Hasil Panorama (Scroll ke kanan/kiri):</div>
    <div class="canvas-container">
        <!-- Lebar 3600px = 10 pixel per 1 derajat (Total 360 derajat) -->
        <canvas id="canvasPano" width="3600" height="480"></canvas>
    </div>
    
    <script>
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('canvasPano');
        const ctx = canvas.getContext('2d');
        const btnMulai = document.getElementById('btnMulai');
        const btnRekam = document.getElementById('btnRekam');
        const statusInfo = document.getElementById('statusInfo');
        
        let isRecording = false;

        // 1. Akses Kamera Belakang
        async function mulaiKamera() {
            try {
                // Meminta akses ke kamera belakang (environment)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                // Hilangkan efek mirror karena ini kamera belakang
                video.style.transform = "scaleX(1)"; 
                statusInfo.innerText = "Kamera aktif. Mencari sensor rotasi...";
                mulaiSensor();
            } catch (err) {
                statusInfo.innerText = "Gagal akses kamera. Pastikan di HTTPS!";
                console.error(err);
            }
        }

        // 2. Akses Sensor Rotasi (Gyroscope / Magnetometer)
        function mulaiSensor() {
            // iOS 13+ mewajibkan pengguna menekan tombol untuk meminta izin sensor
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') addSensorListener();
                        else statusInfo.innerText = "Izin sensor gerak ditolak.";
                    })
                    .catch(console.error);
            } else {
                // Android biasanya langsung bisa mendaftarkan listener
                addSensorListener();
            }
        }

        function addSensorListener() {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            // Fallback untuk perangkat yang hanya mendukung deviceorientation biasa
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        function handleOrientation(event) {
            // alpha adalah derajat putaran HP dari utara (0 - 360 derajat)
            let alpha = event.alpha || event.webkitCompassHeading; 
            
            if (alpha !== null && alpha !== undefined) {
                btnRekam.disabled = false;
                
                // Webkit mengukur berlawanan jarum jam, kita normalkan
                if (event.webkitCompassHeading) alpha = 360 - alpha; 

                if (isRecording) {
                    gambarKeCanvas(alpha);
                } else {
                    statusInfo.innerText = `Sensor aktif. Arah HP: ${Math.round(alpha)}°. Siap merekam!`;
                }
            } else {
                statusInfo.innerText = "HP ini tidak memiliki sensor kompas/rotasi yang terbaca.";
            }
        }

        // 3. Logika Menjahit Gambar (Slit-Scan Stitching)
        function gambarKeCanvas(alpha) {
            // Kita petakan 360 derajat ke kanvas berlebar 3600px (1 derajat = 10 pixel)
            const xPos = alpha * 10;
            
            // Kita hanya mengambil "irisan" vertikal selebar 10 pixel dari tengah kamera
            const sliceWidth = 10;
            const videoCenterX = (video.videoWidth / 2) - (sliceWidth / 2);
            
            if (video.videoWidth > 0) {
                // Sintaks drawImage: (sumber, x-sumber, y-sumber, lebar-sumber, tinggi-sumber, x-tujuan, y-tujuan, lebar-tujuan, tinggi-tujuan)
                ctx.drawImage(
                    video, 
                    videoCenterX, 0, sliceWidth, video.videoHeight, // Potong dari kamera
                    xPos, 0, sliceWidth, canvas.height // Tempel di canvas sesuai derajat
                );
                statusInfo.innerText = `🔴 Merekam... Putar badan perlahan (Derajat: ${Math.round(alpha)}°)`;
            }
        }

        // Event Listeners Tombol
        btnMulai.addEventListener('click', () => {
            btnMulai.disabled = true;
            mulaiKamera();
        });

        btnRekam.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                btnRekam.innerText = "3. Berhenti Rekam";
                btnRekam.classList.add('aktif');
            } else {
                btnRekam.innerText = "2. Mulai Rekam (Putar HP)";
                btnRekam.classList.remove('aktif');
                statusInfo.innerText = "Selesai! Anda bisa sentuh & tahan hasil di bawah untuk menyimpan gambar.";
            }
        });
    </script>
</body>
</html>
